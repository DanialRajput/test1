<!DOCTYPE html>
<html>
<head>
<title>COURSEFOLLOW Layout</title><!-- Add Bootstrap CSS link -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class="container-fluid p-0">
<div class="row">
<div class="col-md-6 offset-md-3">
<div class="header bg-primary text-white py-3">
<h1 style="text-align: left; margin-left: 20px;">COURSEFOLLOW</h1>
</div>
<div class="row">
<div class="col-md-4 bg-success" style="background-color: yellow;">
<button class="btn btn-light btn-block">Home</button>
<button class="btn btn-light btn-block">Login</button>
<button class="btn btn-light btn-block">Register</button>
</div>
<div class="col-md-8" style="background-color: pink;">
<form>
<div class="form-group row">
<label for="name" class="col-sm-3 col-form-label">Name:</label>
<div class="col-sm-9">
<input type="text" class="form-control" id="name" name="name">
</div>
</div>
<div class="form-group row">
<label for="age" class="col-sm-3 col-form-label">Age:</label>
<div class="col-sm-9">
<input type="text" class="form-control" id="age" name="age">
</div>
</div>
<div class="form-group row">
<div class="col-sm-9 offset-sm-3">
<button type="submit" class="btn btn-primary float-right">Submit</button>
</div>
</div>
</form>
</div>
</div>
</div>
</div>
</div>

<!-- Add Bootstrap JS and jQuery scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
