<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbered Boxes Layout</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            width: 450px; /* Increased container size to fit larger boxes */
            height: 450px; /* Increased container size to fit larger boxes */
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            border: 3px solid yellow;
            padding: 10px;
        }
        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px; /* Default font size for boxes */
            font-weight: bold;
            border: 2px solid yellow;
            background-color: #f9f9f9;
            box-shadow: 0 0 10px darkyellow; /* Add dark yellow color around the boxes */
        }

        /* Style boxes individually using their IDs */
        #box1 {
            width: 200px;
            height: 200px;
            font-size: 24px;
        }

        #box2 {
            width: 100px;
            height: 300px;
            font-size: 30px;
        }
        #box3 {
            width: 300px;
            height: 100px;
            font-size: 30px;
        }
        #box4 {
            width: 20px;
            height: 20px;
            font-size: 20px;
        }
        #box5 {
            width: 100px;
            height: 100px;
            font-size: 30px;
        }
        #box6 {
            width: 200px;
            height: 100px;
            font-size: 30px;
        }
        #box7 {
            width: 100px;
            height: 100px;
            font-size: 30px;
        }
        #box8 {
            width: 100px;
            height: 100px;
            font-size: 30px;
        }
        #box9 {
            width: 100px;
            height: 100px;
            font-size: 30px;
        }
        #box10 {
            width: 100px;
            height: 100px;
            font-size: 30px;
        }
        #box11 {
            width: 100px;
            height: 100px;
            font-size: 30px;
        }
        #box12 {
            width: 100px;
            height: 100px;
            font-size: 30px;
        }
        #box13 {
            width: 100px;
            height: 100px;
            font-size: 30px;
        }

        /* Add more styles for other boxes as needed */
    </style>
</head>
<body>
    <div class="container">
        <!-- Assign IDs to boxes and adjust size accordingly -->
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
        <div class="box">13</div>
    </div>
</body>
</html>
